name: Weekly FinCEN update

on:
  schedule:
    # Mondays, 14:17 UTC (7:17 a.m. Arizona)
    - cron: "17 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Pull latest FinCEN items
        id: scrape
        run: |
          python -m fincen_tracker.scraper | tee scrape.log
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          cat scrape.log >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        env:
          SUMMARY: ${{ steps.scrape.outputs.summary }}
        run: |
          if git diff --quiet -- data README.md; then
            echo "No new FinCEN items this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git commit -m "FinCEN update $(date -u +%Y-%m-%d)" -m "$SUMMARY"
          git push
